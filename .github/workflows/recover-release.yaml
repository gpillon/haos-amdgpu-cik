name: Recover completed HAOS release

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish artifact from failed run
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN_ID: "35473773053"
      ARTIFACT_NAME: haos-generic-x86-64-18.3.cik20260919223553-amdgpu-cik
      VERSION: 18.3.cik20260919223553
      STABLE_REF: "18.3"
    steps:
      - name: Verify release API permission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            --data '{}')"
          if [[ "${status}" != "422" ]]; then
            cat response.json
            echo "::error::Expected HTTP 422 from the non-mutating permission probe, got ${status}"
            exit 1
          fi

      - name: Download the completed HAOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify recovered files
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < release/VERSION)" = "${VERSION}"
          test "$(tr -d '\r\n' < release/UPSTREAM_VERSION)" = "${STABLE_REF}"
          (cd release && sha256sum --check SHA256SUMS)

      - name: Publish the rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="HAOS ${VERSION} with AMDGPU CIK"
          notes="Automated generic-x86-64 build from stable Home Assistant OS ${STABLE_REF} with CONFIG_DRM_AMDGPU_CIK=y. Internal HAOS version: ${VERSION}."
          gh release create weekly-latest release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes "${notes}" \
            --latest

      - name: Publish the custom stable manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          official_manifest="$(curl --fail --silent --show-error --location https://version.home-assistant.io/stable.json)"
          raucb_sha256="$(awk '$2 == "haos_generic-x86-64-amdgpu-cik.raucb" {print $1}' release/SHA256SUMS)"
          image_sha256="$(awk '$2 == "haos_generic-x86-64-amdgpu-cik.img.xz" {print $1}' release/SHA256SUMS)"
          manifest="$(jq \
            --arg version "${VERSION}" \
            --arg upstream "${STABLE_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg raucb_sha256 "${raucb_sha256}" \
            --arg image_sha256 "${image_sha256}" \
            '.hassos["generic-x86-64"] = $version
             | .ota = ("https://github.com/" + $repository + "/releases/latest/download/haos_generic-x86-64-amdgpu-cik.raucb")
             | .custom_haos = {
                 upstream_version: $upstream,
                 version: $version,
                 board: "generic-x86-64",
                 raucb_sha256: $raucb_sha256,
                 image_sha256: $image_sha256,
                 release: ("https://github.com/" + $repository + "/releases/tag/weekly-latest")
               }' <<< "${official_manifest}")"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/stable.json?ref=dev" --jq '.sha')"
          content="$(printf '%s\n' "${manifest}" | base64 -w 0)"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/docs/stable.json" \
            -f message="Publish OTA manifest for HAOS ${VERSION}" \
            -f content="${content}" \
            -f branch=dev \
            -f sha="${current_sha}" \
            >/dev/null
