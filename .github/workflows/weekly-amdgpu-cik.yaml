name: Weekly AMDGPU CIK build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the latest stable HAOS release is already published
        required: false
        type: boolean
        default: false
  schedule:
    # Daily at 03:41 UTC. Avoid the top of the hour, when scheduled runs are busier.
    - cron: "41 3 * * *"

permissions: {}

concurrency:
  group: weekly-amdgpu-cik
  cancel-in-progress: false

env:
  BOARD: generic-x86-64
  DEFCONFIG: generic_x86_64
  UPSTREAM_REPOSITORY: home-assistant/operating-system

jobs:
  sync:
    name: Sync the fork and resolve stable HAOS
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      stable_ref: ${{ steps.stable.outputs.ref }}
      should_build: ${{ steps.stable.outputs.should_build }}
    steps:
      - name: Merge upstream dev into this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=dev

      - name: Resolve the latest stable upstream release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          test "$(jq -r '.draft' <<< "${release}")" = "false"
          test "$(jq -r '.prerelease' <<< "${release}")" = "false"
          stable_ref="$(jq -r '.tag_name' <<< "${release}")"
          test -n "${stable_ref}"

          published_ref=""
          if asset_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/weekly-latest" \
            --jq '.assets[] | select(.name == "UPSTREAM_VERSION") | .browser_download_url' 2>/dev/null)" \
            && [[ -n "${asset_url}" ]]; then
            published_ref="$(curl --fail --silent --show-error --location "${asset_url}" | tr -d '\r\n')"
          fi

          force_rebuild='${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}'
          if [[ "${force_rebuild}" == "true" || "${published_ref}" != "${stable_ref}" ]]; then
            should_build=true
          else
            should_build=false
          fi

          echo "ref=${stable_ref}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable: ${stable_ref}"
          echo "Already published upstream stable: ${published_ref:-none}"
          echo "Build required: ${should_build}"

  prepare:
    name: Prepare the HAOS builder
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      builder_image: ${{ steps.builder.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout the latest stable upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.sync.outputs.stable_ref }}
          persist-credentials: false

      - name: Generate a unique HAOS version
        id: version
        shell: bash
        env:
          STABLE_REF: ${{ needs.sync.outputs.stable_ref }}
        run: |
          set -euo pipefail
          source buildroot-external/meta
          source_version="${VERSION_MAJOR}.${VERSION_MINOR}"
          if [[ -n "${VERSION_SUFFIX}" ]]; then
            source_version="${source_version}.${VERSION_SUFFIX}"
          fi
          test "${source_version}" = "${STABLE_REF}"
          suffix="cik$(date --utc +'%Y%m%d%H%M%S')"
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${suffix}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache the HAOS builder
        id: build_builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/haos-builder-amdgpu-cik
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/haos-builder-amdgpu-cik:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/haos-builder-amdgpu-cik:cache,mode=max
          push: true

      - name: Export builder image reference
        id: builder
        shell: bash
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/haos-builder-amdgpu-cik@${{ steps.build_builder.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish generic-x86-64
    needs: [sync, prepare]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the latest stable upstream source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.sync.outputs.stable_ref }}
          submodules: true
          persist-credentials: false

      - name: Reapply and verify the custom kernel fragment
        shell: bash
        run: |
          set -euo pipefail
          fragment='buildroot-external/board/pc/generic-x86-64/kernel.config'
          grep -Fxq 'CONFIG_DRM_AMDGPU=m' "${fragment}"
          sed -i '/^CONFIG_DRM_AMDGPU_CIK=/d; /^# CONFIG_DRM_AMDGPU_CIK is not set$/d' "${fragment}"
          sed -i '/^CONFIG_DRM_AMDGPU=m$/a CONFIG_DRM_AMDGPU_CIK=y' "${fragment}"
          test "$(grep -Fxc 'CONFIG_DRM_AMDGPU_CIK=y' "${fragment}")" -eq 1

      - name: Set build version and stable Supervisor channel
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          suffix="${VERSION#*.*.}"
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${suffix}\2/" buildroot-external/meta

      - name: Install the persistent RAUC signing identity
        shell: bash
        env:
          RAUC_CERTIFICATE_PEM: ${{ secrets.RAUC_CERTIFICATE_PEM }}
          RAUC_PRIVATE_KEY_PEM: ${{ secrets.RAUC_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [[ -z "${RAUC_CERTIFICATE_PEM}" || -z "${RAUC_PRIVATE_KEY_PEM}" ]]; then
            echo "::error::RAUC signing secrets are missing"
            exit 1
          fi
          printf '%s\n' "${RAUC_CERTIFICATE_PEM}" > cert.pem
          printf '%s\n' "${RAUC_PRIVATE_KEY_PEM}" > key.pem
          chmod 600 key.pem
          openssl x509 -in cert.pem -noout -checkend 77760000
          cert_public_key="$({ openssl x509 -in cert.pem -pubkey -noout | openssl pkey -pubin -outform DER; } | sha256sum)"
          private_public_key="$({ openssl pkey -in key.pem -pubout -outform DER; } | sha256sum)"
          test "${cert_public_key%% *}" = "${private_public_key%% *}"

      - name: Free space on the GitHub runner
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo mkdir /mnt/cache
          sudo mkdir /mnt/output
          workspace_owner="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo ln -sfn /mnt/output "${GITHUB_WORKSPACE}/output"
          sudo chown -R "${workspace_owner}" /mnt/cache /mnt/output
          df -h

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ env.BOARD }}-${{ github.run_id }}
          restore-keys: |
            haos-cc-${{ env.BOARD }}-

      - name: Generate Buildroot configuration
        uses: ./.github/actions/haos-builder-command
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: make ${{ env.DEFCONFIG }}_defconfig

      - name: Select stable Home Assistant components
        uses: ./.github/actions/haos-builder-command
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: bash -c 'echo "BR2_PACKAGE_HASSIO_CHANNEL_STABLE=y" >> /build/output/.config && make olddefconfig'

      - name: Build HAOS
        uses: ./.github/actions/haos-builder-command
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: make

      - name: Verify the generated kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          config_file="$(find output/build -path '*/linux-*/.config' -print -quit)"
          test -n "${config_file}"
          grep -Fxq 'CONFIG_DRM_AMDGPU=m' "${config_file}"
          grep -Fxq 'CONFIG_DRM_AMDGPU_CIK=y' "${config_file}"

      - name: Check Linux configuration fragments
        uses: ./.github/actions/haos-builder-command
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" linux-check-dotconfig

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ env.BOARD }}-${{ github.run_id }}

      - name: Prepare stable release filenames
        id: release_files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE_REF: ${{ needs.sync.outputs.stable_ref }}
        run: |
          set -euo pipefail
          mkdir release
          cp "output/images/haos_${BOARD}-${VERSION}.raucb" release/haos_generic-x86-64-amdgpu-cik.raucb
          cp "output/images/haos_${BOARD}-${VERSION}.img.xz" release/haos_generic-x86-64-amdgpu-cik.img.xz
          printf '%s\n' "${VERSION}" > release/VERSION
          printf '%s\n' "${STABLE_REF}" > release/UPSTREAM_VERSION
          (cd release && sha256sum haos_generic-x86-64-amdgpu-cik.raucb haos_generic-x86-64-amdgpu-cik.img.xz > SHA256SUMS)

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haos-${{ env.BOARD }}-${{ needs.prepare.outputs.version }}-amdgpu-cik
          path: release/
          retention-days: 14

      - name: Publish or refresh the rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE_REF: ${{ needs.sync.outputs.stable_ref }}
        run: |
          set -euo pipefail
          title="HAOS ${VERSION} with AMDGPU CIK"
          notes="Automated generic-x86-64 build from stable Home Assistant OS ${STABLE_REF} with CONFIG_DRM_AMDGPU_CIK=y. Internal HAOS version: ${VERSION}."
          if gh release view weekly-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload weekly-latest release/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit weekly-latest --title "${title}" --notes "${notes}" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create weekly-latest release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --latest
          fi

      - name: Publish the custom stable manifest for the post-install updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE_REF: ${{ needs.sync.outputs.stable_ref }}
        run: |
          set -euo pipefail
          official_manifest="$(curl --fail --silent --show-error --location https://version.home-assistant.io/stable.json)"
          raucb_sha256="$(awk '$2 == "haos_generic-x86-64-amdgpu-cik.raucb" {print $1}' release/SHA256SUMS)"
          image_sha256="$(awk '$2 == "haos_generic-x86-64-amdgpu-cik.img.xz" {print $1}' release/SHA256SUMS)"
          test -n "${raucb_sha256}"
          test -n "${image_sha256}"

          manifest="$(jq \
            --arg version "${VERSION}" \
            --arg upstream "${STABLE_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg raucb_sha256 "${raucb_sha256}" \
            --arg image_sha256 "${image_sha256}" \
            '.hassos["generic-x86-64"] = $version
             | .ota = ("https://github.com/" + $repository + "/releases/latest/download/haos_generic-x86-64-amdgpu-cik.raucb")
             | .custom_haos = {
                 upstream_version: $upstream,
                 version: $version,
                 board: "generic-x86-64",
                 raucb_sha256: $raucb_sha256,
                 image_sha256: $image_sha256,
                 release: ("https://github.com/" + $repository + "/releases/tag/weekly-latest")
               }' <<< "${official_manifest}")"

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/stable.json?ref=dev" --jq '.sha' 2>/dev/null || true)"
          content="$(printf '%s\n' "${manifest}" | base64 -w 0)"
          args=(
            --method PUT
            "repos/${GITHUB_REPOSITORY}/contents/docs/stable.json"
            -f message="Publish OTA manifest for HAOS ${VERSION}"
            -f content="${content}"
            -f branch=dev
          )
          if [[ -n "${current_sha}" ]]; then
            args+=( -f sha="${current_sha}" )
          fi
          gh api "${args[@]}" >/dev/null

      - name: Build summary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE_REF: ${{ needs.sync.outputs.stable_ref }}
        run: |
          echo "### HAOS AMDGPU CIK build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream stable release: \`${STABLE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: \`CONFIG_DRM_AMDGPU_CIK=y\` verified in the generated .config" >> "$GITHUB_STEP_SUMMARY"
          echo "- RAUC: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/haos_generic-x86-64-amdgpu-cik.raucb" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest: https://${{ github.repository_owner }}.github.io/haos-amdgpu-cik/stable.json" >> "$GITHUB_STEP_SUMMARY"
