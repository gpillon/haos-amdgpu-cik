name: HAOS AMDGPU CIK Updater
version: 0.1.0
slug: haos_cik_updater
description: Check and install gpillon's signed HAOS AMDGPU CIK updates
url: https://github.com/gpillon/haos-amdgpu-cik
arch:
  - amd64
advanced: true
boot: auto
hassio_api: true
hassio_role: manager
host_dbus: true
ingress: true
ingress_port: 8099
init: false
options:
  manifest_url: https://gpillon.github.io/haos-amdgpu-cik/stable.json
  auto_install: false
  reboot_after_install: false
  check_interval_hours: 6
schema:
  manifest_url: url
  auto_install: bool
  reboot_after_install: bool
  check_interval_hours: int(1,168)
startup: services
